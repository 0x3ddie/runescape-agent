[pytest]
# Default: learner integration, task reward/accounting and the train/evaluate entry points.
# Everything offline: pytest baseline/tests rl/tests
testpaths =
    baseline/tests/test_integration.py
    baseline/tests/test_resource_task.py
    baseline/tests/test_native_slot_flow.py
    baseline/tests/test_entrypoints.py
pythonpath = . rl
addopts = -q -p no:cacheprovider
norecursedirs = .git .venv .hypothesis logs vendor
